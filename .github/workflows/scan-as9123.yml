name: Scan AS9123

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workers:
        description: Concurrent connections per shard
        type: choice
        options: ['50', '100', '200']
        default: '100'
      timeout:
        description: TLS and DNS timeout in seconds
        type: choice
        options: ['3', '5', '10']
        default: '5'

permissions:
  contents: read

concurrency:
  group: scan-as9123-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'
  SCAN_WORKERS: ${{ inputs.workers || '100' }}
  SCAN_TIMEOUT: ${{ inputs.timeout || '5' }}

jobs:
  prepare:
    name: Test and fetch current AS9123 prefixes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Fetch fresh IPv4 prefixes from RIPEstat
        run: |
          for attempt in 1 2 3; do
            if python asnips.py 9123; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Share this run's CIDR snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asn9123-input
          path: asn9123_cidr.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  scan:
    name: Scan IPv4 shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download current CIDR snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asn9123-input
          path: scan-input
      - name: Scan shard with a five-hour limit
        timeout-minutes: 310
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p scan-results
          set +e
          timeout --signal=INT --kill-after=30s 5h \
            python scanner.py scan-input/asn9123_cidr.txt \
              --workers "$SCAN_WORKERS" \
              --timeout "$SCAN_TIMEOUT" \
              --dns-timeout "$SCAN_TIMEOUT" \
              --shard-count 4 --shard-index "$SHARD_INDEX" \
              --output scan-results/detected.txt \
              --details scan-results/detected.jsonl \
              --log scan-results/scanner.log
          scan_exit_code=$?
          printf '%s\n' "$scan_exit_code" > scan-results/exit_code.txt
          exit "$scan_exit_code"
      - name: Upload results even after a scan failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asn9123-shard-${{ matrix.shard }}
          path: scan-results/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  results:
    name: Merge and upload scan results
    needs: [prepare, scan]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download CIDR snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asn9123-input
          path: scan-input
      - name: Download completed and partial shards
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asn9123-shard-*
          path: scan-parts
          merge-multiple: false
      - name: Merge detections and check completeness
        run: |
          python ci/merge_results.py \
            --parts scan-parts --input scan-input/asn9123_cidr.txt \
            --output scan-results --shards 4
      - name: Show scan summary
        if: always()
        run: |
          if test -f scan-results/summary.md; then
            cat scan-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final result artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asn9123-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 30
